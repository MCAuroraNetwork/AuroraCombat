name: AuroraCombat
version: '${version}'
main: club.aurorapvp.auroracombat.AuroraCombat
api-version: '1.20'
authors: [ Villagers654 ]
description: A combat plugin for the Aurora Network
website: aurorapvp.club

permissions:
  auroracombat.admin:
    description: Enables use of AuroraDuels admin commands
    default: op
    children:
      auroracombat.command.auroracombat: true

dependencies:
  server:
    PlaceholderAPI:
      required: false
    WorldGuard:
      required: false